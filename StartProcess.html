<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OTP Email Validation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: #eef3f7;
      font-family: Arial, Helvetica, sans-serif;
    }

    .otp-shell {
      max-width: 560px;
      margin: 48px auto;
      background: #fff;
      border: 1px solid #d8e2ea;
      box-shadow: 0 18px 44px rgba(22, 44, 66, .12);
    }

    .otp-header {
      border-top: 6px solid #0f5e9c;
      padding: 24px 28px 16px;
      border-bottom: 1px solid #d8e2ea;
    }

    .otp-body {
      padding: 24px 28px 28px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="otp-shell">
      <header class="otp-header">
        <h1 class="h3 mb-2">Email OTP Validation</h1>
        <p class="text-secondary mb-0">Enter your email address to receive a 6-digit verification code.</p>
      </header>

      <div class="otp-body">
        <div id="alertBox" class="alert hidden" role="alert"></div>

        <form id="requestOtpForm" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email address</label>
            <input type="email" class="form-control" id="email" autocomplete="email" required>
          </div>
          <button type="submit" id="requestOtpBtn" class="btn btn-primary w-100">Send OTP</button>
        </form>

        <form id="validateOtpForm" class="hidden mt-4" novalidate>
          <div class="mb-3">
            <label for="otp" class="form-label fw-semibold">Enter OTP</label>
            <input type="text" class="form-control" id="otp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required>
            <div class="form-text">Use the 6-digit code sent to your email address.</div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" id="validateOtpBtn" class="btn btn-success flex-fill">Validate OTP</button>
            <button type="button" id="resendOtpBtn" class="btn btn-outline-secondary">Resend</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    const GENERATE_OTP_FLOW_URL = "https://defaultf610c0b7bd244b39810b3dc280afb5.90.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/3d6f8463083d40bf84ef0a658f27efe9/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=eNGIbw3FMUaxR8gPtgCw3C-x5G77DozgJqnjQ8Fubzg";
    const VALIDATE_OTP_FLOW_URL = "https://defaultf610c0b7bd244b39810b3dc280afb5.90.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/3d6f8463083d40bf84ef0a658f27efe9/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=eNGIbw3FMUaxR8gPtgCw3C-x5G77DozgJqnjQ8Fubzg";

    function showAlert(type, message) {
      $("#alertBox")
        .removeClass("hidden alert-success alert-danger alert-warning alert-info")
        .addClass("alert-" + type)
        .text(message);
    }

    function setLoading(buttonSelector, isLoading, textWhenReady, textWhenLoading) {
      const button = $(buttonSelector);
      button.prop("disabled", isLoading);
      button.text(isLoading ? textWhenLoading : textWhenReady);
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function requestOtp() {
      const email = $("#email").val().trim();

      if (!isValidEmail(email)) {
        showAlert("warning", "Please enter a valid email address.");
        return;
      }

      setLoading("#requestOtpBtn", true, "Send OTP", "Sending...");

      $.ajax({
        url: GENERATE_OTP_FLOW_URL,
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify({ email: email, OTPMethod: "Generate", OTP: "", RequestID: "1" }),
        success: function (response) {
          if (response && response.success === false) {
            showAlert("danger", response.message || "Unable to send OTP.");
            return;
          }

          showAlert("success", "OTP sent. Please check your email.");
          $("#validateOtpForm").removeClass("hidden");
          $("#otp").val("").trigger("focus");
        },
        error: function (xhr, textStatus, errorThrown) {
            
            console.log("Status Code:", xhr.status);
            console.log("Status Text:", xhr.statusText);
            console.log("Response:", xhr.responseText);
            console.log("Text Status:", textStatus);
            console.log("Error Thrown:", errorThrown);
          
            showAlert("danger", "There was a problem sending the OTP. Please try again.");
        },
        complete: function () {
          setLoading("#requestOtpBtn", false, "Send OTP", "Sending...");
        }
      });
    }

    function validateOtp() {
      const email = $("#email").val().trim();
      const otp = $("#otp").val().trim();

      if (!isValidEmail(email)) {
        showAlert("warning", "Please enter a valid email address.");
        return;
      }

      if (!/^\d{6}$/.test(otp)) {
        showAlert("warning", "Please enter the 6-digit OTP.");
        return;
      }

      setLoading("#validateOtpBtn", true, "Validate OTP", "Validating...");

      $.ajax({
        url: VALIDATE_OTP_FLOW_URL,
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify({ email: email, otp: otp, OTPMethod: "Validate", RequestID: "1" }),
        success: function (response) {
          if (response && response.success === true) {
            showAlert("success", response.message || "OTP validated successfully.");
            $("#requestOtpBtn, #validateOtpBtn, #resendOtpBtn").prop("disabled", true);
            $("#email, #otp").prop("readonly", true);
          } else {
            showAlert("danger", response.message || "Invalid or expired OTP.");
            setLoading("#validateOtpBtn", false, "Validating", "Validate OTP");
          }
        },
        error: function () {
          showAlert("danger", "There was a problem validating the OTP. Please try again.");
        },
        complete: function () {
          if (!$("#validateOtpBtn").prop("disabled")) {
            setLoading("#validateOtpBtn", false, "Validate OTP", "Validating...");
          }
        }
      });
    }

    $("#requestOtpForm").on("submit", function (event) {
      event.preventDefault();
      requestOtp();
    });

    $("#validateOtpForm").on("submit", function (event) {
      event.preventDefault();
      validateOtp();
    });

    $("#resendOtpBtn").on("click", function () {
      requestOtp();
    });

    $("#otp").on("input", function () {
      this.value = this.value.replace(/\D/g, "").slice(0, 6);
    });
  </script>
</body>
</html>
